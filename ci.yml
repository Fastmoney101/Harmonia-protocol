name: Harmonia CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-foundry:
    name: Foundry Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Install dependencies
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit

      - name: Run Foundry Tests
        working-directory: contracts
        run: forge test --gas-report

  static-analysis:
    name: Static Analysis (Slither)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Slither
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install slither-analyzer

      - name: Run Slither
        working-directory: contracts
        run: slither ./src --exclude-informational || true

  build-artifacts:
    name: Build & Upload Artifacts
    runs-on: ubuntu-latest
    needs: [test-foundry, static-analysis]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Install dependencies
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit

      - name: Build Contracts
        working-directory: contracts
        run: forge build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmonia-contract-artifacts
          path: contracts/out/

  test-rust:
    name: Rust Consensus Node Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Tests
        working-directory: consensus
        run: cargo test

      - name: Check Formatting
        working-directory: consensus
        run: cargo fmt --check

  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [build-artifacts, test-rust]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Install dependencies
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit

      - name: Deploy
        working-directory: contracts
        run: |
          forge script script/Deploy.s.sol \
            --rpc-url ${{ secrets.TESTNET_RPC_URL }} \
            --broadcast \
            --private-key ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        env:
          TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
