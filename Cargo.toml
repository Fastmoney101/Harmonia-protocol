[package]
name = "harmonia-consensus"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Harmonia Protocol consensus node with hashgraph-style gossip-about-gossip and virtual voting"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
warp = "0.3"
rand = "0.8"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] }
